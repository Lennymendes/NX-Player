name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libgl1-mesa-dev \
            libsqlite3-dev xvfb
      - name: Configurer
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compiler
        run: cmake --build build --config Release
      - name: Banc d'essai
        env:
          NX_SELFTEST_LOG: ${{ runner.temp }}/selftest.log
        run: xvfb-run -a -s "-screen 0 1600x1000x24" "build/NXPlayer_artefacts/Release/NX Player" --selftest
      - name: Rapport du banc d'essai
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/selftest.log"
          [ -f "$f" ] || { echo "::warning title=Banc d'essai::aucun journal (plantage avant le démarrage ?)"; exit 0; }
          grep -F "[ÉCHEC]" "$f" | head -20 | while IFS= read -r l; do echo "::error title=Banc d'essai::$l"; done || true
          body=$(tail -n 80 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Fin du journal du banc d'essai::$body"
      - name: Archive
        run: |
          cd build/NXPlayer_artefacts/Release
          tar czf ../../../NXPlayer-Linux.tar.gz "NX Player" Themes Plugins
      - uses: actions/upload-artifact@v4
        with:
          name: NXPlayer-Linux
          path: NXPlayer-Linux.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Configurer (universel arm64 + x86_64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Compiler
        run: cmake --build build --config Release -j 4
      - name: Banc d'essai
        env:
          NX_SELFTEST_LOG: ${{ runner.temp }}/selftest.log
        run: '"build/NXPlayer_artefacts/Release/NX Player.app/Contents/MacOS/NX Player" --selftest'
      - name: Rapport du banc d'essai
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/selftest.log"
          [ -f "$f" ] || { echo "::warning title=Banc d'essai::aucun journal (plantage avant le démarrage ?)"; exit 0; }
          grep -F "[ÉCHEC]" "$f" | head -20 | while IFS= read -r l; do echo "::error title=Banc d'essai::$l"; done || true
          body=$(tail -n 80 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Fin du journal du banc d'essai::$body"
      - name: Archive
        run: ditto -c -k --sequesterRsrc --keepParent "build/NXPlayer_artefacts/Release/NX Player.app" NXPlayer-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NXPlayer-macOS
          path: NXPlayer-macOS.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: SDK ASIO (facultatif, licence Steinberg ou GPLv3)
        shell: bash
        continue-on-error: true
        run: git clone --depth 1 https://github.com/audiosdk/asio "$RUNNER_TEMP/asiosdk"
      - name: Configurer
        shell: bash
        run: |
          ASIO=""
          if [ -f "$RUNNER_TEMP/asiosdk/common/asio.h" ]; then ASIO="-DNX_ASIO_SDK_DIR=$RUNNER_TEMP/asiosdk"; fi
          cmake -B build -G "Visual Studio 17 2022" -A x64 $ASIO
      - name: Compiler
        run: cmake --build build --config Release -- /m
      - name: Banc d'essai
        shell: pwsh
        env:
          NX_SELFTEST_LOG: ${{ runner.temp }}/selftest.log
        run: |
          $p = Start-Process -FilePath "build\NXPlayer_artefacts\Release\NX Player.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          exit $p.ExitCode
      - name: Rapport du banc d'essai
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/selftest.log"
          [ -f "$f" ] || { echo "::warning title=Banc d'essai::aucun journal (plantage avant le démarrage ?)"; exit 0; }
          grep -F "[ÉCHEC]" "$f" | head -20 | while IFS= read -r l; do echo "::error title=Banc d'essai::$l"; done || true
          body=$(tail -n 80 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Fin du journal du banc d'essai::$body"
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path "build\NXPlayer_artefacts\Release\NX Player.exe","build\NXPlayer_artefacts\Release\Themes","build\NXPlayer_artefacts\Release\Plugins" -DestinationPath NXPlayer-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NXPlayer-Windows
          path: NXPlayer-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, macos, windows ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
